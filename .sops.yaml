creation_rules:
  # Shared secrets — all servers need access
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *yubikey-ssh
          - *mac
          - *mac-age
          - *gandi-age
          - *linode-age
          - *dfjay-desktop-age

  # Gandi-specific secrets
  - path_regex: secrets/gandi-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *yubikey-ssh
          - *mac
          - *mac-age
          - *gandi-age

  # Linode-specific secrets
  - path_regex: secrets/linode-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *yubikey-ssh
          - *mac
          - *mac-age
          - *linode-age

  # Desktop and other secrets
  - path_regex: secrets/secret\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *yubikey-ssh
          - *mac
          - *mac-age
          - *mac-host
