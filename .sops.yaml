keys:
  - &yubikey A82705DF08BC95859FF5CB7E577260D68251AC22
  - &mac-age age169gkmzkh42gjt6pylegtk07tzhxhct8ajst32zpqsvanax2u3y5szwxp3t
  - &us-age age1vljcpwhu7h3a46vgc4n8a2wlsf2xmuyvplnka3l03t7fae0ge5tsjnxqh9
  - &ru-age age125e4z55u3642ldaz9qerxk8xfw8egj6pu6qzqfcpc36rksv8cs4qcepk52
  - &nl-age age13dh0hz2fmktvycqn8u4zukha7mahdnnuvgkqezmqr8dahtzlferq5f4cfk
  - &dfjay-desktop-age age1wzuk4e4d0t344mx7z956wslhj60kyn0zlq7shagdxy2l3ppylvqqfcvp48

creation_rules:
  # Shared secrets — all servers need access
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *us-age
          - *ru-age
          - *nl-age

  # us-vps secrets
  - path_regex: secrets/us-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *us-age

  # ru-vps secrets
  - path_regex: secrets/ru-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *ru-age

  # nl-vps secrets
  - path_regex: secrets/nl-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *nl-age

  # Desktop system secrets, decrypted at boot by its host key
  - path_regex: secrets/desktop\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *dfjay-desktop-age

  # User secrets shared by laptop and desktop (home-manager)
  # TODO: add the desktop user age key once generated
  - path_regex: secrets/personal\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age

  # Laptop-only secrets
  - path_regex: secrets/secret\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
