keys:
  - &yubikey A82705DF08BC95859FF5CB7E577260D68251AC22
  - &mac-age age169gkmzkh42gjt6pylegtk07tzhxhct8ajst32zpqsvanax2u3y5szwxp3t
  - &gandi-age age1rhlq6f0e4evcwaucra29nu05wzhv9wu2c8vsh9f580glz44xgsaqtfsugf
  - &linode-age age14pwdxkas42n4kl8qfhxjp35s33ltgu36wkcur4s8f35pxlmk03es9rnwem
  - &regru-age age125e4z55u3642ldaz9qerxk8xfw8egj6pu6qzqfcpc36rksv8cs4qcepk52
  - &dfjay-desktop-age age1wzuk4e4d0t344mx7z956wslhj60kyn0zlq7shagdxy2l3ppylvqqfcvp48

creation_rules:
  # Shared secrets — all servers need access
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *gandi-age
          - *linode-age
          - *regru-age

  # Gandi-specific secrets
  - path_regex: secrets/gandi-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *gandi-age

  # Linode-specific secrets
  - path_regex: secrets/linode-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *linode-age

  # REG.RU-specific secrets
  - path_regex: secrets/regru-vps\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
          - *regru-age

  # Desktop system secrets, decrypted at boot by its host key
  - path_regex: secrets/desktop\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *dfjay-desktop-age

  # User secrets shared by laptop and desktop (home-manager)
  # TODO: add the desktop user age key once generated
  - path_regex: secrets/personal\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age

  # Laptop-only secrets
  - path_regex: secrets/secret\.yaml$
    key_groups:
      - pgp:
          - *yubikey
        age:
          - *mac-age
