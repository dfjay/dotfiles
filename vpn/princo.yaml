princo: v1

defaults:
  engine: sing-box
  acme_email: mail@dfjay.com

  reality:
    server_name: www.samsung.com

  egress: warp

  dns:
    servers:
      quad9: { address: https://dns.quad9.net, resolver: bootstrap }
      bootstrap: { address: 9.9.9.9 }
    final: quad9
    default_resolver: bootstrap
    strategy: prefer_ipv4

  rules:
    - { match: [port:25, port:587, port:465], action: reject }
    - { action: sniff }
    - { match: [geosite:category-ru, geoip:ru], action: reject }

nodes:
  fr:
    ssh: gandi-vps
    hysteria2: { obfs: salamander }
    warp: { endpoint: 162.159.192.1:2408 }

  us:
    ssh: linode-vps
    hysteria2: { obfs: salamander }
    warp: { endpoint: 162.159.192.1:2408 }

  ru:
    ssh: regru-vps
    tags: [domestic]
    ipv6: false
    egress: direct
    dns:
      servers:
        yandex: { address: 77.88.8.8 }
      final: yandex
      default_resolver: yandex
      strategy: prefer_ipv4
    rules:
      - { match: [port:25, port:587, port:465], action: reject }

client:
  groups:
    select:
      nodes: "!domestic"
      default: first
    ru-select:
      nodes: domestic
      include_direct: true
      default: direct
      fallback: direct

  dns:
    servers:
      proxy-dns: { address: https://dns.quad9.net, via: select, resolver: bootstrap-dns }
      direct-dns: { address: 77.88.8.8 }
      bootstrap-dns: { address: 77.88.8.8 }
      ru-dns: { address: 77.88.8.8, via: ru-select }
    final: proxy-dns
    default_resolver: bootstrap-dns
    strategy: prefer_ipv4
    optimistic: true
    rules:
      - { match: [domain_suffix:3gppnetwork.org], server: direct-dns }
      - { match: [geosite:bybit, geosite:category-ru], server: ru-dns }

  rules:
    - { match: [ip:private, network:icmp, domain_suffix:3gppnetwork.org], action: direct } # LAN, ping, VoWiFi
    - { match: [geosite:bybit], via: ru-select }
    - { match: [geosite:category-ip-geo-detect], action: direct }
    - { match: [geosite:category-ru, geoip:ru], via: ru-select }
  final: select

subscription:
  node: fr
