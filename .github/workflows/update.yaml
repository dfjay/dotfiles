name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Update lockfile
        run: nix flake update $(jq -r '.nodes.root.inputs | keys[] | select(. != "spectrum")' flake.lock)

      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: "chore(deps): update flake inputs"
          default_author: github_actions
